<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}{% if class_label %} | {{ class_label }}{% endif %}</title>
  <style>
    :root { color-scheme: light dark; --text: #1a1a1a; --bg: #ffffff; --muted: #4a4a4a; --line: #767676;
            --panel: #f3f3f3; --link: #0b57d0; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #f2f2f2; --bg: #121212; --muted: #c8c8c8; --line: #8a8a8a; --panel: #1e1e1e; --link: #8ab4f8; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 1.125rem; }
    main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    .course { color: var(--muted); margin: 0; }
    h1 { line-height: 1.25; margin: 0.25rem 0 1.5rem; }
    h2, h3, h4, h5, h6 { line-height: 1.3; margin: 2rem 0 0.75rem; }
    a { color: var(--link); }
    :focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
    figure { margin: 1.5rem 0; }
    img { max-width: 100%; height: auto; display: block; }
    figcaption { color: var(--muted); margin-top: 0.5rem; }
    .figure-label { font-weight: 600; color: var(--text); }
    .figure-description { border-left: 4px solid var(--line); padding-left: 1rem; }
    .equation { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; margin: 1rem 0; }
    math { font-size: 1.15em; }
    pre { background: var(--panel); border: 1px solid var(--line); padding: 1rem; overflow-x: auto;
          font-size: 1rem; line-height: 1.5; }
    .table-wrap { overflow-x: auto; margin: 1.5rem 0; }
    table { border-collapse: collapse; min-width: 50%; }
    caption { text-align: left; font-weight: 600; padding-bottom: 0.5rem; }
    th, td { border: 1px solid var(--line); padding: 0.4rem 0.75rem; text-align: left; vertical-align: top; }
    thead th { background: var(--panel); }
    .transcript { border-left: 4px solid var(--line); padding-left: 1rem; }
  </style>
</head>
<body>
<main>
{% if class_label %}<p class="course">{{ class_label }}</p>{% endif %}
<h1>{{ title }}</h1>
{{ body|safe }}
</main>
</body>
</html>
