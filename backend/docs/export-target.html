  <!-- n1, kind="text" -->
  <p>Work is the integral of force along a path.</p>

  <!-- n2, kind="equation". MathML, with the LaTeX as alttext. tabindex because it can scroll. -->
  <div class="equation" tabindex="0">
    <math display="block" alttext="W = \int_{s_1}^{s_2} F \cos\theta \, ds">
      <mrow>
        <mi>W</mi>
        <mo>=</mo>
        <msubsup>
          <mo>&#x222B;</mo>
          <msub><mi>s</mi><mn>1</mn></msub>
          <msub><mi>s</mi><mn>2</mn></msub>
        </msubsup>
        <mi>F</mi>
        <mi>cos</mi>
        <mi>&#x3B8;</mi>
        <mspace width="0.167em"></mspace>
        <mi>d</mi>
        <mi>s</mi>
      </mrow>
    </math>
  </div>
  <p class="math-words"><span class="math-words-label">In words:</span> W equals the integral from s sub 1 to s sub 2 of F cosine theta d s</p>

  <!-- n3, kind="graph". Image embedded in the file. Short alt text. Numbered caption. -->
