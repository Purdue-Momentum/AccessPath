openapi: 3.0.3
info:
  title: AccessPath API
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      operationId: api_v1_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: api_v1_auth_logout_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: api_v1_auth_me_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/classes:
    get:
      operationId: api_v1_classes_list
      description: GET my classes. POST creates a class and makes me its professor.
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'
          description: ''
    post:
      operationId: api_v1_classes_create
      description: GET my classes. POST creates a class and makes me its professor.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Class'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Class'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Class'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
          description: ''
  /api/v1/classes/{class_id}/exports/{export_id}:
    get:
      operationId: api_v1_classes_exports_retrieve
      description: GET one export. The frontend polls this until status is done or
        failed.
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: export_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          description: ''
  /api/v1/classes/{class_id}/exports/{export_id}/download:
    get:
      operationId: api_v1_classes_exports_download_retrieve
      description: GET a short lived link to the finished HTML file.
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: export_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
          description: ''
        '409':
          description: No response body
  /api/v1/classes/{class_id}/lectures:
    get:
      operationId: api_v1_classes_lectures_list
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lecture'
          description: ''
    post:
      operationId: api_v1_classes_lectures_create
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lecture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lecture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Lecture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecture'
          description: ''
  /api/v1/classes/{class_id}/lectures/{lecture_id}/exports:
    get:
      operationId: api_v1_classes_lectures_exports_list
      description: GET this lecture's exports, newest first. POST starts a new export
        of the lecture.
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lecture_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Export'
          description: ''
    post:
      operationId: api_v1_classes_lectures_exports_create
      description: GET this lecture's exports, newest first. POST starts a new export
        of the lecture.
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lecture_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          description: ''
        '409':
          description: No response body
  /api/v1/classes/{class_id}/members:
    get:
      operationId: api_v1_classes_members_list
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/classes/{class_id}/members/{membership_id}:
    patch:
      operationId: api_v1_classes_members_partial_update
      description: PATCH changes a role. DELETE removes someone. Both refuse to remove
        the last professor.
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleChange'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    delete:
      operationId: api_v1_classes_members_destroy
      description: PATCH changes a role. DELETE removes someone. Both refuse to remove
        the last professor.
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          description: No response body
  /api/v1/onboarding:
    post:
      operationId: api_v1_onboarding_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Onboarding'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Onboarding'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Onboarding'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Class:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        subject:
          type: string
          maxLength: 200
        course_code:
          type: string
          maxLength: 50
        term:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        my_role:
          type: string
          nullable: true
          readOnly: true
      required:
      - created_at
      - id
      - my_role
      - name
    Download:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
      - url
    Export:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lecture:
          type: string
          format: uuid
          readOnly: true
        lecture_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ExportStatusEnum'
          readOnly: true
        error:
          type: string
          readOnly: true
        check_report:
          readOnly: true
        version_ids:
          readOnly: true
        created_by_email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - check_report
      - created_at
      - created_by_email
      - error
      - id
      - lecture
      - lecture_title
      - status
      - updated_at
      - version_ids
    ExportStatusEnum:
      enum:
      - queued
      - done
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `done` - Done
        * `failed` - Failed
    Lecture:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        ta_context:
          type: string
          description: What this lecture covers and what students should take away.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
      required:
      - email
      - id
      - name
      - role
      - status
      - user
    Onboarding:
      type: object
      properties:
        onboarding_role:
          $ref: '#/components/schemas/OnboardingRoleEnum'
        onboarding_subject:
          type: string
          maxLength: 200
        name:
          type: string
          maxLength: 200
      required:
      - onboarding_role
    OnboardingRoleEnum:
      enum:
      - teach
      - assist
      type: string
      description: |-
        * `teach` - I teach a class
        * `assist` - I assist (TA)
    PatchedRoleChange:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    RoleEnum:
      enum:
      - professor
      - ta
      type: string
      description: |-
        * `professor` - Professor
        * `ta` - TA
    StatusEnum:
      enum:
      - active
      - removed
      type: string
      description: |-
        * `active` - Active
        * `removed` - Removed
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          maxLength: 200
        purdue_verified:
          type: boolean
          readOnly: true
        onboarding_role:
          oneOf:
          - $ref: '#/components/schemas/OnboardingRoleEnum'
          - $ref: '#/components/schemas/BlankEnum'
        onboarding_subject:
          type: string
          maxLength: 200
        onboarding_completed:
          type: boolean
          readOnly: true
      required:
      - email
      - id
      - onboarding_completed
      - purdue_verified
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
